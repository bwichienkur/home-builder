services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomcraft
      POSTGRES_USER: roomcraft
      POSTGRES_PASSWORD: roomcraft
    volumes:
      - roomcraft_db:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports: ["5432:5432"]
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run server"
    volumes: [".:/app"]
    environment:
      DATABASE_URL: postgres://roomcraft:roomcraft@db:5432/roomcraft
      CLIENT_ORIGIN: http://localhost:5173
      DEV_USER_ID: 00000000-0000-0000-0000-000000000001
    ports: ["4000:4000"]
    depends_on: [db]
volumes:
  roomcraft_db:
