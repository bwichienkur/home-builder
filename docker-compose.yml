services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomcraft
      POSTGRES_USER: roomcraft
      POSTGRES_PASSWORD: roomcraft
    volumes:
      - roomcraft_db:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./server/db/002_vendor_inventory.sql:/docker-entrypoint-initdb.d/002-vendor-inventory.sql:ro
      - ./server/db/003_ops_snapshot.sql:/docker-entrypoint-initdb.d/003-ops-snapshot.sql:ro
      - ./server/db/004_catalog_selection_fields.sql:/docker-entrypoint-initdb.d/004-catalog-selection-fields.sql:ro
      - ./server/db/005_selection_project_extended.sql:/docker-entrypoint-initdb.d/005-selection-project-extended.sql:ro
    ports: ["5432:5432"]
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run server"
    volumes: [".:/app"]
    environment:
      DATABASE_URL: postgres://roomcraft:roomcraft@db:5432/roomcraft
      CLIENT_ORIGIN: http://localhost:5173
      DEV_USER_ID: 00000000-0000-0000-0000-000000000001
    ports: ["4000:4000"]
    depends_on: [db]
volumes:
  roomcraft_db:
